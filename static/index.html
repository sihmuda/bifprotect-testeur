<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BifProtect — Testeur V1</title>
<style>
:root{--bg:#07111f;--card:#0d1b2d;--line:#223751;--text:#eef5ff;--muted:#91a4bd;--a:#35d0ba;--w:#ffc857;--d:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#07111f,#0a1728);color:var(--text);font-family:Inter,system-ui,sans-serif}
main{max-width:980px;margin:40px auto;padding:20px}.brand{font-size:25px;font-weight:850}.sub{color:var(--muted);margin:5px 0 25px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 18px 50px #0004}
.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:15px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}
input{width:100%;background:#081522;color:#fff;border:1px solid #2a4562;border-radius:10px;padding:13px;font-size:15px}
button{margin-top:18px;border:0;border-radius:10px;padding:13px 20px;background:var(--a);color:#06131d;font-weight:850;cursor:pointer}
button:disabled{opacity:.5}.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:13px}.hidden{display:none}
.scorebox{display:flex;align-items:center;gap:24px}.score{width:130px;height:130px;border:9px solid var(--a);border-radius:50%;display:grid;place-items:center;font-size:38px;font-weight:900}
.badge{display:inline-block;padding:7px 11px;border-radius:999px;background:#183247;font-weight:800}.ok{color:var(--a)}.warn{color:var(--w)}.bad{color:var(--d)}
table{width:100%;border-collapse:collapse;margin-top:15px}td,th{padding:11px 7px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}th{color:var(--muted)}
.reason{padding:10px 12px;margin:7px 0;background:#081522;border-radius:9px;font-size:13px}.pill{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<main>
<div class="brand">BifProtect by Grisbiz</div>
<div class="sub">Testeur de qualification technique — V1</div>

<section class="card">
<div class="grid">
<div><label for="siret">SIRET</label><input id="siret" maxlength="14" inputmode="numeric" placeholder="14 chiffres"></div>
<div><label for="site">Site marchand</label><input id="site" placeholder="https://www.exemple.fr"></div>
</div>
<button id="go">Lancer le contrôle</button>
<div id="msg" class="note"></div>
</section>

<section id="result" class="card hidden"></section>
</main>

<script>
const $=x=>document.getElementById(x);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
const icon=v=>v===true?'<span class="ok">✓</span>':v===false?'<span class="bad">✕</span>':'<span class="pill">—</span>';
function badge(d){return d==="ELIGIBLE"?'<span class="badge ok">ÉLIGIBLE</span>':d==="SURVEILLANCE_RENFORCEE"?'<span class="badge warn">SURVEILLANCE RENFORCÉE</span>':'<span class="badge bad">CONTRÔLE COMPLÉMENTAIRE</span>'}

$("go").onclick=async()=>{
 const s=$("siret").value.trim(),site=$("site").value.trim();
 if(!/^\d{14}$/.test(s)){alert("SIRET invalide : 14 chiffres.");return}
 if(!/^https:\/\//i.test(site)){alert("Pour ce test, l'URL doit commencer par https://");return}
 $("go").disabled=true;$("msg").textContent="Analyse réelle du site en cours…";$("result").classList.add("hidden");
 try{
  const r=await fetch("/api/check",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({siret:s,site})});
  const d=await r.json();if(!r.ok)throw Error(d.detail||"Erreur");
  const c=d.controls,x=d.decision;
  const rows=[
   ["SIRET / entreprise",d.identity?.nom||"Non retrouvée",d.identity?.found],
   ["Établissement actif",d.identity?.etat==="A"?"Oui":(d.identity?.etat||"À vérifier"),d.identity?.etat==="A"],
   ["DNS / IPv4",(c.dns.ipv4||[]).join(", ")||"Non résolu",!!c.dns.ipv4?.length],
   ["Site accessible",c.http.reachable?"Oui":"Non",c.http.reachable],
   ["HTTPS","Oui",true],
   ["Certificat TLS",c.tls.valid?`${c.tls.tls_version||"Valide"} — ${c.tls.subject||""}`:"Non validé",c.tls.valid],
   ["HSTS",c.http.security_headers["strict-transport-security"]?"Présent":"Absent",!!c.http.security_headers["strict-transport-security"]],
   ["CSP",c.http.security_headers["content-security-policy"]?"Présente":"Absente",!!c.http.security_headers["content-security-policy"]],
   ["X-Content-Type-Options",c.http.security_headers["x-content-type-options"]?"Présent":"Absent",!!c.http.security_headers["x-content-type-options"]],
   ["X-Frame-Options",c.http.security_headers["x-frame-options"]?"Présent":"Absent",!!c.http.security_headers["x-frame-options"]],
   ["URL finale",c.http.final_url||"—",c.http.final_url?true:null]
  ];
  $("result").innerHTML=`<div class="scorebox"><div class="score">${x.score}</div><div><h2 style="margin:0 0 9px">Score BifProtect</h2>${badge(x.decision)}<p class="note">Le score mesure la compatibilité technique du site avec le prototype BifProtect. Il ne constitue pas une certification de sécurité.</p></div></div>
  <h3>Contrôles effectués</h3><table><tr><th>Contrôle</th><th>Résultat</th><th>État</th></tr>${rows.map(a=>`<tr><td>${esc(a[0])}</td><td>${esc(a[1])}</td><td>${icon(a[2])}</td></tr>`).join("")}</table>
  <h3>Motifs</h3>${x.reasons.length?x.reasons.map(a=>`<div class="reason">${esc(a)}</div>`).join(""):'<div class="reason">Aucun motif négatif selon le barème V1.</div>'}
  <p class="note">Barème ${esc(x.version_bareme)}. Aucun scan intrusif n'est effectué dans cette V1.</p>`;
  $("result").classList.remove("hidden");$("msg").textContent="Contrôle terminé.";
 }catch(e){$("msg").textContent="Erreur : "+e.message}
 finally{$("go").disabled=false}
}
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BifProtect — Testeur de qualification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06101d;--bg2:#091728;--card:#0d1b2d;--card2:#081522;--line:#20364f;
  --text:#eef5ff;--muted:#8fa4bd;--accent:#35d0ba;--accent2:#55e0cf;
  --warn:#ffc857;--bad:#ff6b6b;--blue:#63a8ff;--shadow:0 24px 70px rgba(0,0,0,.28)
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% -10%,#12304a 0,transparent 34%),linear-gradient(145deg,var(--bg),var(--bg2));color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{width:min(980px,100%);margin:0 auto;padding:42px 20px 70px}
.brand-row{display:flex;align-items:center;gap:12px;margin-bottom:8px}.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#239c9a);display:grid;place-items:center;color:#04151c;font-weight:900;font-size:16px;box-shadow:0 8px 28px rgba(53,208,186,.18)}
.brand{font-size:25px;font-weight:850;letter-spacing:-.6px}.sub{color:var(--muted);font-size:13px;margin:0 0 28px 46px}
.card{background:rgba(13,27,45,.94);border:1px solid var(--line);border-radius:22px;padding:25px;margin:18px 0;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
.form-grid{display:grid;grid-template-columns:.72fr 1.28fr;gap:16px}@media(max-width:700px){main{padding:28px 14px 55px}.form-grid{grid-template-columns:1fr}.card{padding:20px;border-radius:19px}.sub{margin-left:0}.brand{font-size:23px}}
label{display:block;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.2px;margin:0 0 8px}
.input-wrap{position:relative}input{width:100%;height:52px;background:#071522;color:var(--text);border:1px solid #29435f;border-radius:12px;padding:0 15px;font:500 15px Inter,system-ui,sans-serif;outline:none;transition:.18s border-color,.18s box-shadow}input:focus{border-color:rgba(53,208,186,.75);box-shadow:0 0 0 3px rgba(53,208,186,.10)}
button{height:50px;margin-top:18px;border:0;border-radius:12px;padding:0 22px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04151c;font:800 14px Inter,system-ui,sans-serif;cursor:pointer;box-shadow:0 10px 28px rgba(53,208,186,.16);transition:transform .15s,filter .15s}button:hover{filter:brightness(1.04);transform:translateY(-1px)}button:disabled{opacity:.65;cursor:wait;transform:none}
.status-line{min-height:24px;margin-top:14px;color:var(--muted);font-size:12px;line-height:1.5}
.loading{display:flex;align-items:center;gap:10px}.spinner{width:15px;height:15px;border:2px solid #27425b;border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.result-head{display:flex;align-items:center;gap:24px}.score{width:132px;height:132px;flex:0 0 132px;border:9px solid var(--accent);border-radius:50%;display:grid;place-items:center;font-size:39px;font-weight:900;letter-spacing:-2px;box-shadow:0 0 34px rgba(53,208,186,.09)}
.result-title{margin:0 0 9px;font-size:24px;letter-spacing:-.6px}.badge{display:inline-flex;align-items:center;padding:7px 11px;border-radius:999px;background:#173247;font-size:12px;font-weight:800}.ok{color:var(--accent)}.warn{color:var(--warn)}.bad{color:var(--bad)}.blue{color:var(--blue)}
.disclaimer{margin:13px 0 0;color:var(--muted);font-size:12px;line-height:1.55}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}@media(max-width:600px){.result-head{align-items:flex-start;gap:16px}.score{width:112px;height:112px;flex-basis:112px;font-size:34px}.result-title{font-size:20px}.summary{grid-template-columns:1fr}}
.summary-card{background:var(--card2);border:1px solid #12283d;border-radius:15px;padding:17px}.summary-kicker{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px}.summary-value{font-size:18px;font-weight:800;margin-top:6px}.summary-text{color:var(--muted);font-size:12px;line-height:1.5;margin-top:6px}
.section-title{font-size:16px;margin:27px 0 10px;letter-spacing:-.2px}.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(max-width:700px){.status-grid{grid-template-columns:1fr}}
.status-card{background:var(--card2);border:1px solid #12283d;border-radius:14px;padding:14px}.status-card .label{font-size:11px;color:var(--muted);margin-bottom:5px}.status-card .value{font-size:13px;font-weight:700}
.action{margin-top:14px;padding:15px 16px;border-radius:14px;background:#0a1b2a;border:1px solid #17364c}.action strong{font-size:14px}.action p{margin:6px 0 0;color:var(--muted);font-size:12px;line-height:1.5}
.footer-note{margin-top:20px;color:#71869f;font-size:10px;line-height:1.5}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="brand-row"><div class="brand-mark">B</div><div class="brand">BifProtect</div></div>
  <div class="sub">Moteur de qualification entreprise · domaine · sécurité</div>

  <section class="card">
    <div class="form-grid">
      <div><label for="siren">SIREN</label><input id="siren" maxlength="9" inputmode="numeric" autocomplete="off" placeholder="9 chiffres"></div>
      <div><label for="site">Site marchand</label><input id="site" value="https://www." placeholder="https://www.exemple.fr" autocomplete="url"></div>
    </div>
    <button id="go">Lancer la vérification</button>
    <div id="msg" class="status-line"></div>
  </section>

  <section id="result" class="card hidden"></section>
</main>
<script>
const $=x=>document.getElementById(x);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
function badge(d){
  if(d==="ELIGIBLE") return '<span class="badge ok">ÉLIGIBLE</span>';
  if(d==="ELIGIBLE_SOUS_RESERVE") return '<span class="badge warn">ÉLIGIBLE SOUS RÉSERVE</span>';
  if(d==="NON_ELIGIBLE") return '<span class="badge bad">NON ÉLIGIBLE</span>';
  if(d==="SURVEILLANCE_RENFORCEE") return '<span class="badge warn">SURVEILLANCE RENFORCÉE</span>';
  return '<span class="badge warn">CONTRÔLE COMPLÉMENTAIRE</span>';
}
function state(v){return v===true?'<span class="ok">Conforme</span>':v===false?'<span class="bad">À traiter</span>':'<span class="warn">À vérifier</span>'}
function legalSummary(l){
  if(!l.available) return "Vérification indisponible";
  if(l.radiation) return "Radiation signalée";
  if(l.liquidation) return "Liquidation signalée";
  if(l.redressement) return "Redressement signalé";
  if(l.sauvegarde) return "Sauvegarde signalée";
  return "Aucune alerte détectée";
}
function domainSummary(dl){
  if(dl.status==="VERIFIED") return "Vérifié";
  if(dl.status==="PROBABLE") return "Probable — justificatif requis";
  return "Non établi — justificatif requis";
}

$("go").onclick=async()=>{
  const siren=$("siren").value.trim();
  let site=$("site").value.trim();
  if(!/^\d{9}$/.test(siren)){alert("SIREN invalide : 9 chiffres.");return}
  if(!/^https?:\/\//i.test(site)) site="https://www."+site.replace(/^\/*/,"");
  if(/^https?:\/\/www\.$/i.test(site)){alert("Saisissez le domaine du site marchand.");return}

  $("go").disabled=true;
  $("result").classList.add("hidden");
  $("msg").innerHTML='<span class="loading"><span class="spinner"></span><span><strong>Analyse approfondie en cours…</strong> · Corrélation multi-sources et qualification automatisée</span></span>';

  try{
    const r=await fetch("/api/check",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({siren,site})});
    const d=await r.json();
    if(!r.ok) throw Error(d.detail||"Erreur");
    const c=d.controls||{}, x=d.decision||{}, i=d.identity||{}, l=d.legal||{}, dl=d.domain_link||{};
    const techIssues=Number(x.technical_issue_count||0);
    const techUnknown=Number(x.technical_unknown_count||0);
    const reserve=Boolean(x.justificatif_required);
    const blocked=Boolean(x.automated_access_blocked);

    let technicalValue;
    let technicalText;
    if(blocked){
      technicalValue="Analyse partielle";
      technicalText="L'accès automatisé est protégé. Les contrôles non mesurables ne sont pas pénalisés.";
    }else if(techIssues===0){
      technicalValue="Aucun écart détecté";
      technicalText="Les contrôles techniques mesurés ne présentent pas d'écart dans le périmètre analysé.";
    }else{
      technicalValue=`${techIssues} sujet${techIssues>1?'s':''} technique${techIssues>1?'s':''} à corriger`;
      technicalText="Les écarts sont intégrés au score. Leur détail technique n'est pas affiché dans cette synthèse.";
    }

    let docValue,docText;
    if(reserve){
      docValue="Justificatif complémentaire requis";
      docText="Un élément documentaire doit être fourni avant la validation définitive.";
    }else if(x.final_validation){
      docValue="Aucun justificatif complémentaire requis";
      docText="Le contrôle automatisé ne demande aucun complément documentaire.";
    }else{
      docValue="Action requise";
      docText="Une condition de qualification nécessite une intervention.";
    }

    const legalOk=i.found&&i.etat==="A"&&l.available&&!l.radiation&&!l.liquidation;
    const domainOk=dl.status==="VERIFIED";
    $("result").innerHTML=`
      <div class="result-head">
        <div class="score">${x.technical_score_available===false?'—':esc(x.score)}</div>
        <div>
          <h2 class="result-title">Score BifProtect</h2>
          ${badge(x.decision)}
          <p class="disclaimer">Le score mesure la compatibilité du site avec le protocole BifProtect. Il ne constitue pas une certification de sécurité. Lorsqu'une mesure technique est impossible, BifProtect ne fabrique pas de score : le contrôle est classé complémentaire.</p>
        </div>
      </div>

      <div class="summary">
        <div class="summary-card">
          <div class="summary-kicker">Analyse technique</div>
          <div class="summary-value">${esc(technicalValue)}</div>
          <div class="summary-text">${esc(technicalText)}</div>
        </div>
        <div class="summary-card">
          <div class="summary-kicker">Qualification documentaire</div>
          <div class="summary-value">${esc(docValue)}</div>
          <div class="summary-text">${esc(docText)}</div>
        </div>
      </div>

      <h3 class="section-title">Synthèse de qualification</h3>
      <div class="status-grid">
        <div class="status-card"><div class="label">Entreprise</div><div class="value">${esc(i.nom||"Non retrouvée")} · ${state(i.found&&i.etat==="A")}</div></div>
        <div class="status-card"><div class="label">Statut juridique</div><div class="value">${esc(legalSummary(l))}</div></div>
        <div class="status-card"><div class="label">Entreprise ↔ domaine</div><div class="value ${domainOk?'ok':(dl.status==='PROBABLE'?'warn':'bad')}">${esc(domainSummary(dl))}</div></div>
      </div>

      ${blocked?`<div class="action"><strong class="warn">Accès automatisé protégé</strong><p>Le site répond à un mécanisme de protection destiné aux accès automatisés. BifProtect ne considère pas cette situation comme une défaillance du site et n'impute aucune absence d'en-tête HTTP non mesurée.</p></div>`:''}
      ${x.blockers?.length?`<div class="action"><strong class="bad">Condition bloquante détectée</strong><p>La qualification ne peut pas être validée automatiquement tant que cette condition juridique n'est pas levée.</p></div>`:''}
      ${reserve?`<div class="action"><strong class="warn">Justificatif complémentaire</strong><p>Le contrôle complémentaire n'empêche pas la souscription, mais le justificatif requis devra être obtenu avant la validation définitive.</p></div>`:''}
      <p class="footer-note">Barème ${esc(x.version_bareme||"3.3")} · Analyse non intrusive · Les contrôles conformes sont intégrés au calcul mais ne sont pas détaillés dans cette synthèse.</p>`;
    $("result").classList.remove("hidden");
    $("msg").textContent="Analyse terminée — résultat consolidé.";
  }catch(e){
    $("msg").textContent="Échec de l'analyse : "+e.message;
  }finally{$("go").disabled=false}
};
</script>
</body>
</html>

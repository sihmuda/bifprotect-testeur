<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BifProtect — Qualification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090B;--fg:#F1EEE8;--muted:#A7A49E;--line:#3A3F43;--accent:#C9B48A;
  --ok:#B8C9B1;--warn:#D6B879;--bad:#C9877D;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased}
main{width:min(1000px,100%);margin:0 auto;padding:30px 20px 60px}
nav{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:9px 0 14px;margin-bottom:32px}
.logo{font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:14px}.tag{color:var(--accent);font-size:10px;letter-spacing:.11em;text-transform:uppercase}
.hero{padding:0 0 30px;border-bottom:1px solid var(--line)}
.eyebrow{color:var(--accent);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.13em;margin:0 0 10px}
h1{margin:0;max-width:760px;font-size:clamp(34px,5vw,54px);line-height:1;letter-spacing:-.045em;font-weight:700}
section{padding:30px 0;border-bottom:1px solid var(--line)}
.section-kicker{color:var(--accent);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;margin-bottom:15px}
.form-grid{display:grid;grid-template-columns:.72fr 1.28fr;gap:12px}
@media(max-width:700px){main{padding:24px 16px 50px}.form-grid{grid-template-columns:1fr}.tag{display:none}}
.field label{display:block;color:var(--muted);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;margin:0 0 7px}
input{width:100%;height:48px;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:0;padding:0 13px;font:500 14px Inter,system-ui,sans-serif;outline:none;transition:border-color .18s,background .18s}
input:focus{border-color:var(--accent);background:#0A0C0E}
button{height:46px;margin-top:15px;border:1px solid var(--accent);border-radius:0;padding:0 19px;background:var(--accent);color:#11110F;font:700 11px Inter,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.07em;cursor:pointer;transition:background .15s,transform .15s}
button:hover{background:#D8C39A;transform:translateY(-1px)}button:disabled{opacity:.6;cursor:wait;transform:none}
.status-line{min-height:22px;margin-top:12px;color:var(--muted);font-size:11px;line-height:1.5}
.loading{display:flex;align-items:center;gap:9px}.spinner{width:13px;height:13px;border:1px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
#result{padding-top:30px}
.result-head{display:grid;grid-template-columns:138px 1fr;gap:28px;align-items:start}
@media(max-width:620px){.result-head{grid-template-columns:1fr;gap:20px}}
.score-wrap{border-top:1px solid var(--accent);padding-top:10px}.score-label{color:var(--accent);font-size:10px;text-transform:uppercase;letter-spacing:.11em;font-weight:600}.score{font-size:58px;line-height:.95;font-weight:700;letter-spacing:-.055em;margin-top:8px}.score-unit{color:var(--muted);font-size:10px;margin-top:6px}
.result-title{margin:0 0 10px;font-size:25px;line-height:1.05;letter-spacing:-.025em;font-weight:700}
.badge{display:inline-flex;align-items:center;padding:6px 9px;border:1px solid var(--line);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.badge.ok{border-color:#657262;color:var(--ok)}.badge.warn{border-color:#776845;color:var(--warn)}.badge.bad{border-color:#704D49;color:var(--bad)}
.disclaimer{margin:12px 0 0;color:var(--muted);font-size:11px;line-height:1.55;max-width:650px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px}@media(max-width:650px){.summary{grid-template-columns:1fr}}
.summary-card{border:1px solid var(--line);padding:17px 18px;min-height:125px}.summary-kicker{color:var(--accent);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em}.summary-value{font-size:16px;font-weight:700;letter-spacing:-.015em;margin-top:9px}.summary-text{color:var(--muted);font-size:11px;line-height:1.55;margin-top:6px}
.section-title{font-size:19px;letter-spacing:-.02em;margin:34px 0 14px;font-weight:700}
.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
@media(max-width:700px){.status-grid{grid-template-columns:1fr}}
.status-card{padding:16px 15px 17px;border-right:1px solid var(--line)}.status-card:last-child{border-right:0}@media(max-width:700px){.status-card{border-right:0;border-bottom:1px solid var(--line)}.status-card:last-child{border-bottom:0}}
.status-card .label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}.status-card .value{font-size:12px;font-weight:600;line-height:1.45}
.action{margin-top:18px;padding:16px 17px;border:1px solid var(--line);border-left:2px solid var(--accent)}.action strong{font-size:12px;font-weight:700}.action p{margin:6px 0 0;color:var(--muted);font-size:11px;line-height:1.55}
.footer-note{margin-top:18px;color:#77746F;font-size:9px;line-height:1.55}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <nav>
    <div class="logo">BifProtect</div>
    <div class="tag">Qualification · Protection · Revenus</div>
  </nav>

  <header class="hero">
    <p class="eyebrow">BifProtect</p>
    <h1>La protection optimale de vos revenus</h1>
  </header>

  <section>
    <div class="section-kicker">Lancer une qualification</div>
    <div class="form-grid">
      <div class="field"><label for="siren">SIREN</label><input id="siren" maxlength="9" inputmode="numeric" autocomplete="off" placeholder="9 chiffres"></div>
      <div class="field"><label for="site">Site marchand</label><input id="site" value="https://www." placeholder="https://www.exemple.fr" autocomplete="url"></div>
    </div>
    <button id="go">Lancer la vérification</button>
    <div id="msg" class="status-line"></div>
  </section>

  <section id="result" class="hidden"></section>
</main>
<script>
const $=x=>document.getElementById(x);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
function badge(d){
  if(d==="ELIGIBLE") return '<span class="badge ok">ÉLIGIBLE</span>';
  if(d==="ELIGIBLE_SOUS_RESERVE") return '<span class="badge warn">ÉLIGIBLE SOUS RÉSERVE</span>';
  if(d==="NON_ELIGIBLE") return '<span class="badge bad">NON ÉLIGIBLE</span>';
  if(d==="SURVEILLANCE_RENFORCEE") return '<span class="badge warn">SURVEILLANCE RENFORCÉE</span>';
  return '<span class="badge warn">CONTRÔLE COMPLÉMENTAIRE</span>';
}
function state(v){return v===true?'<span class="ok">Conforme</span>':v===false?'<span class="bad">À traiter</span>':'<span class="warn">À vérifier</span>'}
function legalSummary(l){
  if(!l.available) return "Vérification indisponible";
  if(l.radiation) return "Radiation signalée";
  if(l.liquidation) return "Liquidation signalée";
  if(l.redressement) return "Redressement signalé";
  if(l.sauvegarde) return "Sauvegarde signalée";
  return "Aucune alerte détectée";
}
function domainSummary(dl){
  if(dl.status==="VERIFIED") return "Vérifié";
  if(dl.status==="PROBABLE") return "Probable — justificatif requis";
  return "Non établi — justificatif requis";
}

$("go").onclick=async()=>{
  const siren=$("siren").value.trim();
  let site=$("site").value.trim();
  if(!/^\d{9}$/.test(siren)){alert("SIREN invalide : 9 chiffres.");return}
  if(!/^https?:\/\//i.test(site)) site="https://www."+site.replace(/^\/*/,"");
  if(/^https?:\/\/www\.$/i.test(site)){alert("Saisissez le domaine du site marchand.");return}

  $("go").disabled=true;
  $("result").classList.add("hidden");
  $("msg").innerHTML='<span class="loading"><span class="spinner"></span><span><strong>Analyse approfondie en cours…</strong> · Corrélation multi-sources et qualification automatisée</span></span>';

  try{
    const r=await fetch("/api/check",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({siren,site})});
    const d=await r.json();
    if(!r.ok) throw Error(d.detail||"Erreur");
    const c=d.controls||{}, x=d.decision||{}, i=d.identity||{}, l=d.legal||{}, dl=d.domain_link||{};
    const techIssues=Number(x.technical_issue_count||0);
    const reserve=Boolean(x.justificatif_required);
    const blocked=Boolean(x.automated_access_blocked);

    let technicalValue;
    let technicalText;
    if(blocked){
      technicalValue="Analyse partielle";
      technicalText="L'accès automatisé est protégé. Les contrôles non mesurables ne sont pas pénalisés.";
    }else if(techIssues===0){
      technicalValue="Aucun écart détecté";
      technicalText="Les contrôles techniques mesurés ne présentent pas d'écart dans le périmètre analysé.";
    }else{
      technicalValue=`${techIssues} sujet${techIssues>1?'s':''} technique${techIssues>1?'s':''} à corriger`;
      technicalText="Les écarts sont intégrés au score. Leur détail technique n'est pas affiché dans cette synthèse.";
    }

    let docValue,docText;
    if(reserve){
      docValue="Justificatif complémentaire requis";
      docText="Un élément documentaire doit être fourni avant la validation définitive.";
    }else if(x.final_validation){
      docValue="Aucun justificatif complémentaire requis";
      docText="Le contrôle automatisé ne demande aucun complément documentaire.";
    }else{
      docValue="Action requise";
      docText="Une condition de qualification nécessite une intervention.";
    }

    const domainOk=dl.status==="VERIFIED";
    $("result").innerHTML=`
      <div class="result-top">
        <div class="score-wrap">
          <div class="score-label">Score BifProtect</div>
          <div class="score">${x.technical_score_available===false?'—':esc(x.score)}</div>
          <div class="score-unit">Indice de compatibilité</div>
        </div>
        <div>
          <h2 class="result-title">Qualification du site</h2>
          ${badge(x.decision)}
          <p class="disclaimer">Le score mesure la compatibilité technique du site avec le protocole BifProtect. Il ne constitue pas une certification de sécurité.</p>
        </div>
      </div>

      <div class="summary">
        <div class="summary-card">
          <div class="summary-kicker">Analyse technique</div>
          <div class="summary-value">${esc(technicalValue)}</div>
          <div class="summary-text">${esc(technicalText)}</div>
        </div>
        <div class="summary-card">
          <div class="summary-kicker">Qualification documentaire</div>
          <div class="summary-value">${esc(docValue)}</div>
          <div class="summary-text">${esc(docText)}</div>
        </div>
      </div>

      <h3 class="section-title">Synthèse de qualification</h3>
      <div class="status-grid">
        <div class="status-card"><div class="label">Entreprise</div><div class="value">${esc(i.nom||"Non retrouvée")} · ${state(i.found&&i.etat==="A")}</div></div>
        <div class="status-card"><div class="label">Statut juridique</div><div class="value">${esc(legalSummary(l))}</div></div>
        <div class="status-card"><div class="label">Entreprise ↔ domaine</div><div class="value ${domainOk?'ok':(dl.status==='PROBABLE'?'warn':'bad')}">${esc(domainSummary(dl))}</div></div>
      </div>

      ${blocked?`<div class="action"><strong class="warn">Accès automatisé protégé</strong><p>Le site répond à un mécanisme de protection destiné aux accès automatisés. BifProtect ne considère pas cette situation comme une défaillance du site et n'impute aucune absence d'en-tête HTTP non mesurée.</p></div>`:''}
      ${x.blockers?.length?`<div class="action"><strong class="bad">Condition bloquante détectée</strong><p>La qualification ne peut pas être validée automatiquement tant que cette condition juridique n'est pas levée.</p></div>`:''}
      ${reserve?`<div class="action"><strong class="warn">Justificatif complémentaire</strong><p>Le contrôle complémentaire n'empêche pas la souscription, mais le justificatif requis devra être obtenu avant la validation définitive.</p></div>`:''}
      <p class="footer-note">Barème ${esc(x.version_bareme||"3.6")} · Analyse non intrusive · Les contrôles conformes sont intégrés au calcul mais ne sont pas détaillés dans cette synthèse.</p>`;
    $("result").classList.remove("hidden");
    $("msg").textContent="Analyse terminée — résultat consolidé.";
  }catch(e){
    $("msg").textContent="Échec de l'analyse : "+e.message;
  }finally{$("go").disabled=false}
};
</script>
</body>
</html>

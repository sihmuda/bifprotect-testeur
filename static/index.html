<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BifProtect — Testeur V2.5</title>
<style>
:root{--bg:#07111f;--card:#0d1b2d;--line:#223751;--text:#eef5ff;--muted:#91a4bd;--a:#35d0ba;--w:#ffc857;--d:#ff6b6b;--b:#63a8ff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#07111f,#0a1728);color:var(--text);font-family:Inter,system-ui,sans-serif}
main{max-width:980px;margin:30px auto;padding:20px}.brand{font-size:25px;font-weight:850}.sub{color:var(--muted);margin:5px 0 25px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 18px 50px #0004}
.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:15px}@media(max-width:700px){.grid{grid-template-columns:1fr}}label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}input{width:100%;background:#081522;color:#fff;border:1px solid #2a4562;border-radius:10px;padding:13px;font-size:15px}
button{margin-top:18px;border:0;border-radius:10px;padding:13px 20px;background:var(--a);color:#06131d;font-weight:850;cursor:pointer}button:disabled{opacity:.5}.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:13px}.hidden{display:none}
.scorebox{display:flex;align-items:center;gap:24px}.score{width:130px;height:130px;border:9px solid var(--a);border-radius:50%;display:grid;place-items:center;font-size:38px;font-weight:900}.badge{display:inline-block;padding:7px 11px;border-radius:999px;background:#183247;font-weight:800}.ok{color:var(--a)}.warn{color:var(--w)}.bad{color:var(--d)}.blue{color:var(--b)}
table{width:100%;border-collapse:collapse;margin-top:15px}td,th{padding:11px 7px;border-bottom:1px solid var(--line);font-size:13px;text-align:left;vertical-align:top}th{color:var(--muted)}.reason{padding:10px 12px;margin:7px 0;background:#081522;border-radius:9px;font-size:13px}.pill{font-size:11px;color:var(--muted)}
.section-title{margin:28px 0 8px;font-size:17px}.decision-box{padding:15px;border-radius:12px;background:#081522;margin-top:15px}.small{font-size:11px;color:var(--muted)}
</style></head>
<body><main>
<div class="brand">BifProtect by Grisbiz</div><div class="sub">Testeur de qualification entreprise · domaine · sécurité — V2.5</div>
<section class="card"><div class="grid"><div><label for="siret">SIRET</label><input id="siret" maxlength="14" inputmode="numeric" placeholder="14 chiffres"></div><div><label for="site">Site marchand</label><input id="site" placeholder="https://www.exemple.fr"></div></div><button id="go">Lancer le contrôle</button><div id="msg" class="note"></div></section>
<section id="result" class="card hidden"></section></main>
<script>
const $=x=>document.getElementById(x);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
const icon=v=>v===true?'<span class="ok">✓</span>':v===false?'<span class="bad">✕</span>':'<span class="pill">—</span>';
function badge(d){if(d==="ELIGIBLE")return'<span class="badge ok">ÉLIGIBLE</span>';if(d==="ELIGIBLE_SOUS_RESERVE")return'<span class="badge warn">ÉLIGIBLE SOUS RÉSERVE</span>';if(d==="NON_ELIGIBLE")return'<span class="badge bad">NON ÉLIGIBLE</span>';return'<span class="badge warn">SURVEILLANCE / CONTRÔLE</span>'}
function statusLabel(s){return s==="VERIFIED"?'<span class="ok">Vérifié</span>':s==="PROBABLE"?'<span class="warn">Probable</span>':'<span class="bad">Non établi</span>'}
function legalText(l){if(!l.available)return"Non vérifiable automatiquement";return l.radiation?"Radiation signalée":l.liquidation?"Liquidation judiciaire signalée":l.redressement?"Redressement judiciaire signalé":l.sauvegarde?"Sauvegarde signalée":"Aucune alerte BODACC détectée"}

$("go").onclick=async()=>{const s=$("siret").value.trim(),site=$("site").value.trim();if(!/^\d{14}$/.test(s)){alert("SIRET invalide : 14 chiffres.");return}if(!/^https:\/\//i.test(site)){alert("L'URL doit commencer par https://");return}
$("go").disabled=true;$("msg").textContent="Vérification entreprise, statut juridique, rattachement du domaine et sécurité…";$("result").classList.add("hidden");
try{const r=await fetch("/api/check",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({siret:s,site})});const d=await r.json();if(!r.ok)throw Error(d.detail||"Erreur");const c=d.controls,x=d.decision,i=d.identity,l=d.legal,dl=d.domain_link;
const identityRows=[
["SIRET / entreprise",i.nom||"Non retrouvée",i.found],
["Entreprise active",i.etat==="A"?"Oui":(i.etat==="F"?"Cessée":"À vérifier"),i.etat==="A"],
["Établissement correspondant",i.establishment_match?"SIRET confirmé":"Non confirmé",i.establishment_match],
["Établissement actif",i.establishment_state==="A"?"Oui":(i.establishment_state==="F"?"Fermé":"À vérifier"),i.establishment_state==="A"?true:(i.establishment_state==="F"?false:null)],
["Radiation",l.available?(l.radiation?"Signalée":"Aucune détectée"):"À vérifier",l.available?!l.radiation:null],
["Procédure collective",legalText(l),l.available?(!l.liquidation&&!l.redressement&&!l.sauvegarde):null]
];
const techRows=[["DNS / IPv4",(c.dns.ipv4||[]).join(", ")||"Non résolu",!!c.dns.ipv4?.length],["Site accessible",c.http.reachable?"Oui":"Non",c.http.reachable],["HTTPS","Oui",true],["Certificat TLS",c.tls.valid?`${c.tls.tls_version||"Valide"} — ${c.tls.subject||""}`:"Non validé",c.tls.valid],["HSTS",c.http.security_headers["strict-transport-security"]?"Présent":"Absent",!!c.http.security_headers["strict-transport-security"]],["CSP",c.http.security_headers["content-security-policy"]?"Présente":"Absente",!!c.http.security_headers["content-security-policy"]],["X-Content-Type-Options",c.http.security_headers["x-content-type-options"]?"Présent":"Absent",!!c.http.security_headers["x-content-type-options"]],["X-Frame-Options",c.http.security_headers["x-frame-options"]?"Présent":"Absent",!!c.http.security_headers["x-frame-options"]],["URL finale",c.http.final_url||"—",!!c.http.final_url]];
const issueTable=(title,rows)=>{const bad=rows.filter(a=>a[2]!==true);return bad.length?`<h3 class="section-title">${title}</h3><table><tr><th>Contrôle</th><th>Résultat</th><th>État</th></tr>${bad.map(a=>`<tr><td>${esc(a[0])}</td><td>${esc(a[1])}</td><td>${icon(a[2])}</td></tr>`).join('')}</table>`:'';};
const reserve=x.decision==="ELIGIBLE_SOUS_RESERVE";
$("result").innerHTML=`<div class="scorebox"><div class="score">${x.score}</div><div><h2 style="margin:0 0 9px">Score BifProtect</h2>${badge(x.decision)}<p class="note">Le score mesure la compatibilité technique du site avec le protocole BifProtect. Il ne constitue pas une certification de sécurité.</p></div></div>
<div class="decision-box"><strong>${x.can_subscribe?"Souscription possible":"Souscription impossible"}</strong><div class="note">${reserve?"Le contrôle complémentaire n'empêche pas la souscription. Un justificatif du lien entre l'entreprise et le domaine devra être fourni avant validation définitive.":x.final_validation?"Aucun justificatif complémentaire n'est requis par ce contrôle.":"Une condition bloquante empêche la souscription."}</div></div>
${issueTable("1. Identité & statut juridique",identityRows)}
${dl.status!=="VERIFIED"?`<h3 class="section-title">Rattachement du domaine — point à traiter</h3><table><tr><th>Contrôle</th><th>Résultat</th><th>État</th></tr><tr><td>Entreprise ↔ domaine</td><td>${esc(dl.label)}</td><td>${statusLabel(dl.status)}</td></tr></table>`:""}
${reserve?`<div class="decision-box"><strong>📄 Justificatif à fournir</strong><div class="note">Document établissant le lien entre l'entreprise identifiée par le SIRET et le domaine exploité. Exemples : attestation signée du représentant légal, document contractuel d'exploitation du domaine, ou tout justificatif équivalent permettant d'établir ce lien.</div></div>`:''}
${issueTable("3. Sécurité technique",techRows)}
<p class="small">Barème ${esc(x.version_bareme)} · Seuls les contrôles non conformes, à vérifier ou complémentaires sont affichés · Contrôle non intrusif.</p>`;
$("result").classList.remove("hidden");$("msg").textContent="Contrôle terminé.";
}catch(e){$("msg").textContent="Erreur : "+e.message}finally{$("go").disabled=false}}
</script></body></html>
